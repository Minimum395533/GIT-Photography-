<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burgers</title>
    <style>
        :root {
            color-scheme: dark;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #0b0f14;
            color: #f3f6fa;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #151c25;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #263242;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: scale(1.02);
            border-color: #40546d;
        }
        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            aspect-ratio: 1/1;
        }
        .card-content {
            padding: 15px;
        }
        .card-content h3 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
        }
        .card-content p {
            margin: 0;
            color: #aeb9c7;
            font-size: 0.9rem;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            text-align: center;
            max-width: 90%;
            max-height: 90%;
        }
        .modal-content img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
        }
        .modal-info {
            color: white;
            padding: 20px;
            margin-top: 15px;
        }
        .modal-info h2 {
            margin: 0 0 10px 0;
        }
        .modal-info p {
            margin: 0;
            font-size: 1.1rem;
        }
        .close {
            color: white;
            font-size: 40px;
            font-weight: bold;
            position: absolute;
            top: 20px;
            right: 35px;
            cursor: pointer;
        }
        .close:hover {
            color: #ccc;
        }
        .ai-description-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 15px;
            transition: background 0.3s;
        }
        .ai-description-btn:hover {
            background: #45a049;
        }
        .ai-description-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .regen-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        .regen-btn {
            background: #9c27b0;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }
        .regen-btn:hover {
            background: #7b1fa2;
        }
        .regen-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .creativity-btn {
            background: #2196F3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s;
        }
        .creativity-btn:hover {
            background: #1976D2;
        }
        .creativity-btn.active {
            background: #0d47a1;
        }

        .ai-description {
            color: white;
            margin-top: 15px;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            font-style: italic;
            min-height: 20px;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #shuffleBtn:hover {
            background: #0b7dda;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; margin-bottom: 30px;">Photography Gallery</h1>
    <div style="text-align: center; margin-bottom: 20px;">
        <button id="shuffleBtn" style="padding: 10px 20px; background: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem;">
            Shuffle Images
        </button>
    </div>
    <div id="fullscreenModal" class="modal">
        <span class="close">&times;</span>
        <div class="modal-content">
            <img id="modalImage" src="" alt="">
            <div class="modal-info">
                <h2 id="modalTitle"></h2>
                <p id="modalDescription"></p>
                <button id="aiDescriptionBtn" class="ai-description-btn">Generate AI Description</button>
                <div id="regenControls" class="regen-controls" style="display: none;">
                    <button id="regenBtn" class="regen-btn">Regenerate</button>
                    <button id="creativityToggle" class="creativity-btn">More Creative</button>
                </div>
                <div id="aiDescriptionContainer" class="ai-description" style="display: none;">
                    <span id="aiDescriptionText"></span>
                    <span id="loadingSpinner" class="loading" style="display: none;"></span>
                </div>
            </div>
        </div>
    </div>
    <div class="gallery">
        <div class="card">
            <a href="images/mcdonalds_hamburger.jpg" class="image-link" data-image-id="image-1" data-src="images/mcdonalds_hamburger.jpg" data-alt="McDonalds Hamburger" data-desc="">
                <img src="images/mcdonalds_hamburger.jpg" alt="McDonalds Hamburger">
            </a>
            <div class="card-content">
                <p></p>
            </div>
        </div>
        <div class="card">
            <a href="images/mcdonalds_quarterpounder.png" class="image-link" data-image-id="image-2" data-src="images/mcdonalds_quarterpounder.png" data-alt="McDonalds Quarter Pounder" data-desc="">
                <img src="images/mcdonalds_quarterpounder.png" alt="McDonalds Quarter Pounder">
            </a>
            <div class="card-content">
                <p></p>
            </div>
        </div>
        <div class="card">
            <a href="images/mcdonalds_bigmac.png" class="image-link" data-image-id="image-3" data-src="images/mcdonalds_bigmac.png" data-alt="McDonalds Big Mac" data-desc="">
                <img src="images/mcdonalds_bigmac.png" alt="McDonalds Big Mac">
            </a>
            <div class="card-content">
                <p></p>
            </div>
        </div>
        <div class="card">
            <a href="images/burgerking_sliders.jpg" class="image-link" data-image-id="image-4" data-src="images/burgerking_sliders.jpg" data-alt="Burger King Sliders" data-desc="">
                <img src="images/burgerking_sliders.jpg" alt="Burger King Sliders">
            </a>
            <div class="card-content">
                <p></p>
            </div>
        </div>
        <div class="card">
            <a href="images/burgerking_bbq_brisket.jpg" class="image-link" data-image-id="image-5" data-src="images/burgerking_bbq_brisket.jpg" data-alt="Burger King BBQ Brisket" data-desc="">
                <img src="images/burgerking_bbq_brisket.jpg" alt="Burger King BBQ Brisket">
            </a>
            <div class="card-content">
                <p></p>
            </div>
        </div>
        <div class="card">
            <a href="images/burgerking_chicken_sandwich.png" class="image-link" data-image-id="image-6" data-src="images/burgerking_chicken_sandwich.png" data-alt="Burger King Chicken Sandwich" data-desc="">
                <img src="images/burgerking_chicken_sandwich.png" alt="Burger King Chicken Sandwich">
            </a>
            <div class="card-content">
                <p></p>
            </div>
        </div>
        <div class="card">
            <a href="images/wendys_square_burger.jpg" class="image-link" data-image-id="image-7" data-src="images/wendys_square_burger.jpg" data-alt="Wendys Square Burger" data-desc="">
                <img src="images/wendys_square_burger.jpg" alt="Wendys Square Burger">
            </a>
            <div class="card-content">
                <p></p>
            </div>
        </div>
        <div class="card">
            <a href="images/wendys_daves_double.png" class="image-link" data-image-id="image-8" data-src="images/wendys_daves_double.png" data-alt="Wendys Dave's Double" data-desc="">
                <img src="images/wendys_daves_double.png" alt="Wendys Dave's Double">
            </a>
            <div class="card-content">
                <p></p>
            </div>
        </div>
        <div class="card">
            <a href="images/wendys_secret_menu.webp" class="image-link" data-image-id="image-9" data-src="images/wendys_secret_menu.webp" data-alt="Wendys Secret Menu Item" data-desc="">
                <img src="images/wendys_secret_menu.webp" alt="Wendys Secret Menu Item">
            </a>
            <div class="card-content">
                <p></p>
            </div>
        </div>
    </div>
    <script>
        function hasTransparency(image) {
            const canvas = document.createElement('canvas');
            canvas.width = image.naturalWidth || 300;
            canvas.height = image.naturalHeight || 300;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(image, 0, 0);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            for (let i = 3; i < imageData.data.length; i += 4) {
                if (imageData.data[i] < 255) {
                    return true;
                }
            }
            return false;
        }

        function imageToDataUri(imageSrc) {
            return new Promise((resolve, reject) => {
                if (imageSrc.startsWith('data:')) {
                    resolve(imageSrc);
                    return;
                }
                const image = new Image();
                image.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = image.naturalWidth || 300;
                    canvas.height = image.naturalHeight || 300;
                    const ctx = canvas.getContext('2d');
                    const hasAlpha = hasTransparency(image);
                    if (hasAlpha) {
                        ctx.fillStyle = 'white';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }
                    ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg'));
                };
                image.onerror = () => reject(new Error('Unable to prepare the selected image.'));
                image.src = imageSrc;
            });
        }

        async function generateAIDescription(imageSrc, imageId, options = {}) {
            const requestImage = await imageToDataUri(imageSrc);
            const params = {
                seed: options.seed !== undefined ? options.seed : Math.floor(Math.random() * 2147483647),
                temperature: options.temperature !== undefined ? options.temperature : 0.7,
                repetition_penalty: options.repetition_penalty !== undefined ? options.repetition_penalty : 1.1,
                top_p: 0.9,
                top_k: 50
            };
            const response = await fetch('/api/generate-description', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    imageId, 
                    image: requestImage,
                    seed: params.seed,
                    temperature: params.temperature,
                    repetition_penalty: params.repetition_penalty,
                    top_p: params.top_p,
                    top_k: params.top_k
                })
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || 'Cerebras could not generate a description.');
            }
            return data;
        }

        function setCardDescription(link, description) {
            link.dataset.desc = description;
            const cardDescription = link.closest('.card')?.querySelector('.card-content p');
            if (cardDescription) {
                cardDescription.textContent = description;
            }
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const modal = document.getElementById('fullscreenModal');
            const modalImage = document.getElementById('modalImage');
            const modalTitle = document.getElementById('modalTitle');
            const modalDescription = document.getElementById('modalDescription');
            const closeBtn = document.querySelector('.close');
            const aiDescriptionBtn = document.getElementById('aiDescriptionBtn');
            const aiDescriptionContainer = document.getElementById('aiDescriptionContainer');
            const aiDescriptionText = document.getElementById('aiDescriptionText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const regenControls = document.getElementById('regenControls');
            const regenBtn = document.getElementById('regenBtn');
            const creativityToggle = document.getElementById('creativityToggle');

            let currentImageSrc = '';
            let currentImageId = '';
            let currentImageLink = null;
            let descriptionsByImage = {};
            let useHighCreativity = false;

            try {
                const response = await fetch('/api/descriptions');
                if (response.ok) {
                    descriptionsByImage = await response.json();
                }
            } catch (error) {
                console.warn('Saved descriptions could not be loaded:', error);
            }

            const imageLinks = document.querySelectorAll('.image-link');

            imageLinks.forEach(link => {
                const savedDescription = descriptionsByImage[link.dataset.imageId]?.description;
                if (savedDescription) {
                    setCardDescription(link, savedDescription);
                }
            });

            imageLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const src = this.getAttribute('data-src') || this.querySelector('img')?.src || '';
                    const alt = this.getAttribute('data-alt');
                    const desc = this.getAttribute('data-desc');
                    const imageName = src.startsWith('data:') ? alt : src.split('/').pop();
                    const imageId = this.dataset.imageId;
                    const savedDescription = descriptionsByImage[imageId]?.description;

                    currentImageSrc = src;
                    currentImageId = imageId;
                    currentImageLink = this;
                    modalImage.src = src;
                    modalImage.alt = alt;
                    modalTitle.textContent = imageName;
                    if (savedDescription) {
                        modalDescription.textContent = savedDescription;
                        aiDescriptionText.textContent = savedDescription;
                        aiDescriptionContainer.style.display = 'block';
                        aiDescriptionBtn.style.display = 'none';
                        regenControls.style.display = 'flex';
                    } else {
                        modalDescription.textContent = desc;
                        aiDescriptionContainer.style.display = 'none';
                        aiDescriptionText.textContent = '';
                        aiDescriptionBtn.style.display = 'inline-block';
                        aiDescriptionBtn.disabled = false;
                        regenControls.style.display = 'none';
                    }
                    modal.style.display = 'flex';
                });
            });

            closeBtn.addEventListener('click', function() {
                modal.style.display = 'none';
            });

            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });

            const shuffleBtn = document.getElementById('shuffleBtn');
            const gallery = document.querySelector('.gallery');

            shuffleBtn.addEventListener('click', function() {
                const cards = Array.from(gallery.querySelectorAll('.card'));
                for (let i = cards.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [cards[i], cards[j]] = [cards[j], cards[i]];
                }
                cards.forEach(card => gallery.appendChild(card));
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    modal.style.display = 'none';
                }
            });
            creativityToggle.addEventListener('click', function() {
                useHighCreativity = !useHighCreativity;
                creativityToggle.textContent = useHighCreativity ? 'Less Creative' : 'More Creative';
                creativityToggle.classList.toggle('active', useHighCreativity);
            });

            regenBtn.addEventListener('click', async function() {
                regenBtn.disabled = true;
                loadingSpinner.style.display = 'inline-block';
                aiDescriptionText.textContent = 'Regenerating description...';

                try {
                    const temperature = useHighCreativity ? 0.9 : 0.3;
                    const result = await generateAIDescription(currentImageSrc, currentImageId, {
                        seed: Math.floor(Math.random() * 2147483647),
                        temperature: temperature,
                        repetition_penalty: 1.15
                    });
                    const description = result.description;
                    descriptionsByImage[currentImageId] = {
                        description,
                        image_hash: result.image_hash || ''
                    };
                    setCardDescription(currentImageLink, description);
                    aiDescriptionText.textContent = description;
                    modalDescription.textContent = description;
                } catch (error) {
                    console.error('Error regenerating AI description:', error);
                    aiDescriptionText.textContent = error.message || 'Error regenerating description. Try again.';
                } finally {
                    loadingSpinner.style.display = 'none';
                    regenBtn.disabled = false;
                }
            });


            aiDescriptionBtn.addEventListener('click', async function() {
                aiDescriptionBtn.disabled = true;
                loadingSpinner.style.display = 'inline-block';
                aiDescriptionContainer.style.display = 'block';
                aiDescriptionText.textContent = 'Generating a description with Cerebras…';

                try {
                    const result = await generateAIDescription(currentImageSrc, currentImageId);
                    const description = result.description;
                    descriptionsByImage[currentImageId] = {
                        description,
                        image_hash: result.image_hash || ''
                    };
                    setCardDescription(currentImageLink, description);
                    aiDescriptionText.textContent = description;
                    modalDescription.textContent = description;
                    aiDescriptionBtn.style.display = 'none';
                    regenControls.style.display = 'flex';
                } catch (error) {
                    console.error('Error generating AI description:', error);
                    aiDescriptionText.textContent = error.message || 'Error generating description. Try again.';
                } finally {
                    loadingSpinner.style.display = 'none';
                    if (aiDescriptionBtn.style.display !== 'none') {
                        aiDescriptionBtn.disabled = false;
                    }
                }
            });
        });
    </script>
</body>
</html>
