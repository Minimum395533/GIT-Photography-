<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burgers</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: scale(1.02);
        }
        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            aspect-ratio: 1/1;
        }
        .card-content {
            padding: 15px;
        }
        .card-content h3 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
        }
        .card-content p {
            margin: 0;
            color: #666;
            font-size: 0.9rem;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            text-align: center;
            max-width: 90%;
            max-height: 90%;
        }
        .modal-content img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
        }
        .modal-info {
            color: white;
            padding: 20px;
            margin-top: 15px;
        }
        .modal-info h2 {
            margin: 0 0 10px 0;
        }
        .modal-info p {
            margin: 0;
            font-size: 1.1rem;
        }
        .close {
            color: white;
            font-size: 40px;
            font-weight: bold;
            position: absolute;
            top: 20px;
            right: 35px;
            cursor: pointer;
        }
        .close:hover {
            color: #ccc;
        }
        .ai-description-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 15px;
            transition: background 0.3s;
        }
        .ai-description-btn:hover {
            background: #45a049;
        }
        .ai-description-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .ai-description {
            color: white;
            margin-top: 15px;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            font-style: italic;
            min-height: 20px;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; margin-bottom: 30px;">Burgers</h1>
    <div id="fullscreenModal" class="modal">

        <div class="modal-content">
            <img id="modalImage" src="" alt="">
            <div class="modal-info">
                <h2 id="modalTitle"></h2>
                <p id="modalDescription"></p>
                <button id="aiDescriptionBtn" class="ai-description-btn">Generate AI Description</button>
                <div id="aiDescriptionContainer" class="ai-description" style="display: none;">
                    <span id="aiDescriptionText"></span>
                    <span id="loadingSpinner" class="loading" style="display: none;"></span>
                </div>
            </div>
        </div>
    </div>
    <div class="gallery">
        <div class="card">

            </a>

                <p></p>

        </div>
        <div class="card">
            <a href="images/mcdonalds_quarterpounder.png" class="image-link" data-src="images/mcdonalds_quarterpounder.png" data-alt="McDonalds Quarter Pounder" data-desc="">
                <img src="images/mcdonalds_quarterpounder.png" alt="McDonalds Quarter Pounder">
            </a>
            <div class="card-content">
                <p></p>
            </div>
        </div>
        <div class="card">
            <a href="images/mcdonalds_bigmac.png" class="image-link" data-src="images/mcdonalds_bigmac.png" data-alt="McDonalds Big Mac" data-desc="">
                <img src="images/mcdonalds_bigmac.png" alt="McDonalds Big Mac">
            </a>
            <div class="card-content">
                <p></p>
            </div>
        </div>
        <div class="card">
            <a href="images/burgerking_sliders.jpg" class="image-link" data-src="images/burgerking_sliders.jpg" data-alt="Burger King Sliders" data-desc="">
                <img src="images/burgerking_sliders.jpg" alt="Burger King Sliders">
            </a>
            <div class="card-content">
                <p></p>
            </div>
        </div>
        <div class="card">
            <a href="images/burgerking_bbq_brisket.jpg" class="image-link" data-src="images/burgerking_bbq_brisket.jpg" data-alt="Burger King BBQ Brisket" data-desc="">
                <img src="images/burgerking_bbq_brisket.jpg" alt="Burger King BBQ Brisket">
            </a>
            <div class="card-content">
                <p></p>
            </div>
        </div>
        <div class="card">
            <a href="images/burgerking_chicken_sandwich.png" class="image-link" data-src="images/burgerking_chicken_sandwich.png" data-alt="Burger King Chicken Sandwich" data-desc="">
                <img src="images/burgerking_chicken_sandwich.png" alt="Burger King Chicken Sandwich">

        <div class="card">

                <img src="images/wendys_daves_double.png" alt="Wendys Dave's Double">
            </a>
            <div class="card-content">

            </div>
        </div>
        <div class="card">
            <a href="images/wendys_secret_menu.jpg" class="image-link" data-src="images/wendys_secret_menu.jpg" data-alt="Wendys Secret Menu Item" data-desc="">
                <img src="images/wendys_secret_menu.jpg" alt="Wendys Secret Menu Item">
            </a>
            <div class="card-content">
                <p></p>
            </div>
        </div>
    </div>
    <script>
        const CEREBRAS_API_KEY = 'csk-j9nrjkhtpyf2pc4dtenc3p6py9r6d4c6jnyd9pfc2mtvcf4t';
        const CEREBRAS_API_URL = 'https://api.cerebras.net/v1/predict';

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        function setCookie(name, value, days) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = `expires=${date.toUTCString()}`;
            document.cookie = `${name}=${value};${expires};path=/`;
        }

        function imageToBase64(imgElement) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                canvas.width = imgElement.naturalWidth || 512;
                canvas.height = imgElement.naturalHeight || 512;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(imgElement, 0, 0, canvas.width, canvas.height);
                const base64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
                resolve(base64);
            });
        }

        async function generateAIDescription(imageSrc, imageName) {
            const cookieName = `desc_${imageName}`;
            const cached = getCookie(cookieName);
            if (cached) {
                return cached;
            }

            try {
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                await new Promise((resolve, reject) => {
                    img.onload = resolve;
                    img.onerror = reject;
                    img.src = imageSrc;
                });

                const base64Image = await imageToBase64(img);

                const response = await fetch(CEREBRAS_API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${CEREBRAS_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'cerebras/llava-1.5-7b',
                        inputs: `data:image/jpeg;base64,${base64Image}`,
                        prompt: 'Describe this image in detail.'
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status} - ${response.statusText}`);
                }

                const data = await response.json();
                let description = '';
                if (data && data.generated_text) {
                    description = data.generated_text;
                } else if (Array.isArray(data) && data[0] && data[0].generated_text) {
                    description = data[0].generated_text;
                } else if (data && data.output && data.output[0]) {
                    description = data.output[0];
                } else {
                    description = 'Could not generate description. Try again.';
                }

                setCookie(cookieName, description, 30);
                return description;
            } catch (error) {
                console.error('Error generating AI description:', error);
                return 'Error generating description. Check console.';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('fullscreenModal');
            const modalImage = document.getElementById('modalImage');
            const modalTitle = document.getElementById('modalTitle');
            const modalDescription = document.getElementById('modalDescription');
            const closeBtn = document.querySelector('.close');
            const aiDescriptionBtn = document.getElementById('aiDescriptionBtn');
            const aiDescriptionContainer = document.getElementById('aiDescriptionContainer');
            const aiDescriptionText = document.getElementById('aiDescriptionText');
            const loadingSpinner = document.getElementById('loadingSpinner');

            let currentImageSrc = '';

            const imageLinks = document.querySelectorAll('.image-link');

            imageLinks.forEach(link => {
                link.addEventListener('click', async function(e) {
                    e.preventDefault();
                    const src = this.getAttribute('data-src');
                    const alt = this.getAttribute('data-alt');
                    const imageName = src.split('/').pop() || `image_${Array.from(imageLinks).indexOf(this) + 1}`;

                    currentImageSrc = src;
                    modalImage.src = src;
                    modalImage.alt = alt;
                    modalTitle.textContent = imageName;
                    modalDescription.textContent = '';

                    aiDescriptionBtn.disabled = true;
                    loadingSpinner.style.display = 'inline-block';
                    aiDescriptionContainer.style.display = 'block';
                    aiDescriptionText.textContent = 'Generating description...';

                    const description = await generateAIDescription(src, imageName);

                    modalDescription.textContent = description;
                    aiDescriptionText.textContent = description;
                    loadingSpinner.style.display = 'none';
                    aiDescriptionBtn.disabled = false;

                    modal.style.display = 'flex';
                });
            });

            closeBtn.addEventListener('click', function() {
                modal.style.display = 'none';
            });

            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    modal.style.display = 'none';
                }
            });

            aiDescriptionBtn.addEventListener('click', async function() {
                const imageName = modalTitle.textContent;
                aiDescriptionBtn.disabled = true;
                loadingSpinner.style.display = 'inline-block';
                aiDescriptionText.textContent = 'Regenerating...';

                const description = await generateAIDescription(currentImageSrc, imageName);
                modalDescription.textContent = description;
                aiDescriptionText.textContent = description;

                loadingSpinner.style.display = 'none';
                aiDescriptionBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
