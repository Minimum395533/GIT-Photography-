<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burgers</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: scale(1.02);
        }
        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            aspect-ratio: 1/1;
        }
        .card-content {
            padding: 15px;
        }
        .card-content h3 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
        }
        .card-content p {
            margin: 0;
            color: #666;
            font-size: 0.9rem;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            text-align: center;
            max-width: 90%;
            max-height: 90%;
        }
        .modal-content img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
        }
        .modal-info {
            color: white;
            padding: 20px;
            margin-top: 15px;
        }
        .modal-info h2 {
            margin: 0 0 10px 0;
        }
        .modal-info p {
            margin: 0;
            font-size: 1.1rem;
        }
        .close {
            color: white;
            font-size: 40px;
            font-weight: bold;
            position: absolute;
            top: 20px;
            right: 35px;
            cursor: pointer;
        }
        .close:hover {
            color: #ccc;
        }
        .ai-description-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 15px;
            transition: background 0.3s;
        }
        .ai-description-btn:hover {
            background: #45a049;
        }
        .ai-description-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .ai-description {
            color: white;
            margin-top: 15px;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            font-style: italic;
            min-height: 20px;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .tag-filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .tag-btn {
            padding: 10px 20px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }
        .tag-btn:hover {
            border-color: #4CAF50;
            background: #f0f0f0;
        }
        .tag-btn.active {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }
        .tag-btn.burgerking { border-color: #ff6600; }
        .tag-btn.burgerking:hover { border-color: #ff6600; background: #f0f0f0; }
        .tag-btn.burgerking.active { background: #ff6600; border-color: #ff6600; color: white; }
        .tag-btn.mcdonalds { border-color: #c41e3a; }
        .tag-btn.mcdonalds:hover { border-color: #c41e3a; background: #f0f0f0; }
        .tag-btn.mcdonalds.active { background: #c41e3a; border-color: #c41e3a; color: white; }
        .tag-btn.wendys { border-color: #1e3a8a; }
        .tag-btn.wendys:hover { border-color: #1e3a8a; background: #f0f0f0; }
        .tag-btn.wendys.active { background: #1e3a8a; border-color: #1e3a8a; color: white; }
        .tag-row {
            margin-bottom: 20px;
        }
        .tag-label {
            display: block;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px 5px 0 0;
            color: white;
        }
        .tag-label.burgerking { background: #ff6600; }
        .tag-label.mcdonalds { background: #c41e3a; }
        .tag-label.wendys { background: #1e3a8a; }
        .tag-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; margin-bottom: 30px;">Burgers</h1>
    <div class="tag-filters">
        <button class="tag-btn burgerking" data-tag="Burger King">Burger King</button>
        <button class="tag-btn mcdonalds" data-tag="McDonald's">McDonald's</button>
        <button class="tag-btn wendys" data-tag="Wendy's">Wendy's</button>
        <button class="tag-btn" data-tag="all">All</button>
    </div>
    <div id="galleryContainer" class="gallery">
    </div>
    <div id="fullscreenModal" class="modal">
        <span class="close">&times;</span>
        <div class="modal-content">
            <img id="modalImage" src="" alt="">
            <div class="modal-info">
                <h2 id="modalTitle"></h2>
                <p id="modalDescription"></p>
                <button id="aiDescriptionBtn" class="ai-description-btn">Generate AI Description</button>
                <div id="aiDescriptionContainer" class="ai-description" style="display: none;">
                    <span id="aiDescriptionText"></span>
                    <span id="loadingSpinner" class="loading" style="display: none;"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CEREBRAS_API_KEY = 'csk-j9nrjkhtpyf2pc4dtenc3p6py9r6d4c6jnyd9pfc2mtvcf4t';
        const CEREBRAS_API_URL = 'https://api.cerebras.net/v1/predict';

        const burgers = [
            { src: 'images/mcdonalds_hamburger.jpg', alt: "McDonald's Hamburger", tag: "McDonald's" },
            { src: 'images/mcdonalds_quarterpounder.png', alt: "McDonald's Quarter Pounder", tag: "McDonald's" },
            { src: 'images/mcdonalds_bigmac.png', alt: "McDonald's Big Mac", tag: "McDonald's" },
            { src: 'images/burgerking_sliders.jpg', alt: "Burger King Sliders", tag: "Burger King" },
            { src: 'images/burgerking_bbq_brisket.jpg', alt: "Burger King BBQ Brisket", tag: "Burger King" },
            { src: 'images/burgerking_chicken_sandwich.png', alt: "Burger King Chicken Sandwich", tag: "Burger King" },
            { src: 'images/wendys_square_burger.jpg', alt: "Wendy's Square Burger", tag: "Wendy's" },
            { src: 'images/wendys_daves_double.png', alt: "Wendy's Dave's Double", tag: "Wendy's" },
            { src: 'images/wendys_secret_menu.jpg', alt: "Wendy's Secret Menu Item", tag: "Wendy's" }
        ];

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        function setCookie(name, value, days) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = `expires=${date.toUTCString()}`;
            document.cookie = `${name}=${value};${expires};path=/`;
        }

        function imageToBase64(imgElement) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                canvas.width = imgElement.naturalWidth || 512;
                canvas.height = imgElement.naturalHeight || 512;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(imgElement, 0, 0, canvas.width, canvas.height);
                const base64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
                resolve(base64);
            });
        }

        async function generateAIDescription(imageSrc, imageName) {
            const cookieName = `desc_${imageName}`;
            const cached = getCookie(cookieName);
            if (cached) {
                return cached;
            }

            try {
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                await new Promise((resolve, reject) => {
                    img.onload = resolve;
                    img.onerror = reject;
                    img.src = imageSrc;
                });

                const base64Image = await imageToBase64(img);

                const response = await fetch(CEREBRAS_API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${CEREBRAS_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'cerebras/llava-1.5-7b',
                        inputs: `data:image/jpeg;base64,${base64Image}`,
                        prompt: 'Describe this image in detail.'
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status} - ${response.statusText}`);
                }

                const data = await response.json();
                let description = '';
                if (data && data.generated_text) {
                    description = data.generated_text;
                } else if (Array.isArray(data) && data[0] && data[0].generated_text) {
                    description = data[0].generated_text;
                } else if (data && data.output && data.output[0]) {
                    description = data.output[0];
                } else {
                    description = 'Could not generate description. Try again.';
                }

                setCookie(cookieName, description, 30);
                return description;
            } catch (error) {
                console.error('Error generating AI description:', error);
                return 'Error generating description. Check console.';
            }
        }

        function renderGallery(filterTag) {
            const gallery = document.getElementById('galleryContainer');
            gallery.innerHTML = '';

            if (filterTag === 'all') {
                burgers.forEach(burger => {
                    const card = createCard(burger);
                    gallery.appendChild(card);
                });
                return;
            }

            const grouped = {};
            burgers.forEach(burger => {
                if (filterTag === 'all' || burger.tag === filterTag) {
                    if (!grouped[burger.tag]) {
                        grouped[burger.tag] = [];
                    }
                    grouped[burger.tag].push(burger);
                }
            });

            const sortedTags = Object.keys(grouped).sort();
            sortedTags.forEach(tag => {
                const tagRow = document.createElement('div');
                tagRow.className = 'tag-row';

                const tagLabel = document.createElement('div');
                tagLabel.className = `tag-label ${tag.toLowerCase().replace(/\s+/g, '').replace(/'/g, '')}`;
                tagLabel.textContent = tag;
                tagRow.appendChild(tagLabel);

                const tagGrid = document.createElement('div');
                tagGrid.className = 'tag-grid';

                grouped[tag].forEach(burger => {
                    const card = createCard(burger);
                    tagGrid.appendChild(card);
                });

                tagRow.appendChild(tagGrid);
                gallery.appendChild(tagRow);
            });

            if (Object.keys(grouped).length === 0) {
                const noResults = document.createElement('div');
                noResults.className = 'no-results';
                noResults.textContent = 'No burgers found for this filter.';
                gallery.appendChild(noResults);
            }
        }

        function createCard(burger) {
            const card = document.createElement('div');
            card.className = 'card';

            const link = document.createElement('a');
            link.href = burger.src;
            link.className = 'image-link';
            link.setAttribute('data-src', burger.src);
            link.setAttribute('data-alt', burger.alt);
            link.setAttribute('data-desc', '');

            const img = document.createElement('img');
            img.src = burger.src;
            img.alt = burger.alt;

            link.appendChild(img);
            card.appendChild(link);

            const cardContent = document.createElement('div');
            cardContent.className = 'card-content';
            const tagP = document.createElement('p');
            tagP.textContent = burger.tag;
            cardContent.appendChild(tagP);
            card.appendChild(cardContent);

            return card;
        }

        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('fullscreenModal');
            const modalImage = document.getElementById('modalImage');
            const modalTitle = document.getElementById('modalTitle');
            const modalDescription = document.getElementById('modalDescription');
            const closeBtn = document.querySelector('.close');
            const aiDescriptionBtn = document.getElementById('aiDescriptionBtn');
            const aiDescriptionContainer = document.getElementById('aiDescriptionContainer');
            const aiDescriptionText = document.getElementById('aiDescriptionText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const galleryContainer = document.getElementById('galleryContainer');
            const tagButtons = document.querySelectorAll('.tag-btn');

            let currentImageSrc = '';

            renderGallery('all');

            tagButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    tagButtons.forEach(b => {
                        b.classList.remove('active');
                    });
                    this.classList.add('active');
                    const filterTag = this.getAttribute('data-tag');
                    renderGallery(filterTag);
                });
            });

            galleryContainer.addEventListener('click', function(e) {
                const link = e.target.closest('.image-link');
                if (!link) return;

                e.preventDefault();
                const src = link.getAttribute('data-src');
                const alt = link.getAttribute('data-alt');
                const imageName = src.split('/').pop() || alt;

                currentImageSrc = src;
                modalImage.src = src;
                modalImage.alt = alt;
                modalTitle.textContent = imageName;
                modalDescription.textContent = '';

                aiDescriptionBtn.disabled = true;
                loadingSpinner.style.display = 'inline-block';
                aiDescriptionContainer.style.display = 'block';
                aiDescriptionText.textContent = 'Generating description...';

                generateAIDescription(src, imageName).then(description => {
                    modalDescription.textContent = description;
                    aiDescriptionText.textContent = description;
                    loadingSpinner.style.display = 'none';
                    aiDescriptionBtn.disabled = false;
                    modal.style.display = 'flex';
                });
            });

            closeBtn.addEventListener('click', function() {
                modal.style.display = 'none';
            });

            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    modal.style.display = 'none';
                }
            });

            aiDescriptionBtn.addEventListener('click', async function() {
                const imageName = modalTitle.textContent;
                aiDescriptionBtn.disabled = true;
                loadingSpinner.style.display = 'inline-block';
                aiDescriptionText.textContent = 'Regenerating...';

                const description = await generateAIDescription(currentImageSrc, imageName);
                modalDescription.textContent = description;
                aiDescriptionText.textContent = description;

                loadingSpinner.style.display = 'none';
                aiDescriptionBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
