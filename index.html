<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: scale(1.02);
        }
        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            aspect-ratio: 1/1;
        }
        .card-content {
            padding: 15px;
        }
        .card-content h3 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
        }
        .card-content p {
            margin: 0;
            color: #666;
            font-size: 0.9rem;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            text-align: center;
            max-width: 90%;
            max-height: 90%;
        }
        .modal-content img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
        }
        .modal-info {
            color: white;
            padding: 20px;
            margin-top: 15px;
        }
        .modal-info h2 {
            margin: 0 0 10px 0;
        }
        .modal-info p {
            margin: 0;
            font-size: 1.1rem;
        }
        .close {
            color: white;
            font-size: 40px;
            font-weight: bold;
            position: absolute;
            top: 20px;
            right: 35px;
            cursor: pointer;
        }
        .close:hover {
            color: #ccc;
        }
        .ai-description-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 15px;
            transition: background 0.3s;
        }
        .ai-description-btn:hover {
            background: #45a049;
        }
        .ai-description-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .ai-description {
            color: white;
            margin-top: 15px;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            font-style: italic;
            min-height: 20px;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; margin-bottom: 30px;">Photography Gallery</h1>
    <div id="fullscreenModal" class="modal">
        <span class="close">&times;</span>
        <div class="modal-content">
            <img id="modalImage" src="" alt="">
            <div class="modal-info">
                <h2 id="modalTitle"></h2>
                <p id="modalDescription"></p>
                <button id="aiDescriptionBtn" class="ai-description-btn">Generate AI Description</button>
                <div id="aiDescriptionContainer" class="ai-description" style="display: none;">
                    <span id="aiDescriptionText"></span>
                    <span id="loadingSpinner" class="loading" style="display: none;"></span>
                </div>
            </div>
        </div>
    </div>

        </div>
    </div>
    <script>
        const HUGGINGFACE_API_KEY = '';
        const HUGGINGFACE_MODEL = 'Salesforce/blip-image-captioning-base';
        const HUGGINGFACE_API_URL = `https://api-inference.huggingface.co/models/${HUGGINGFACE_MODEL}`;

        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('fullscreenModal');
            const modalImage = document.getElementById('modalImage');
            const modalTitle = document.getElementById('modalTitle');
            const modalDescription = document.getElementById('modalDescription');
            const closeBtn = document.querySelector('.close');
            const aiDescriptionBtn = document.getElementById('aiDescriptionBtn');
            const aiDescriptionContainer = document.getElementById('aiDescriptionContainer');
            const aiDescriptionText = document.getElementById('aiDescriptionText');
            const loadingSpinner = document.getElementById('loadingSpinner');

            let currentImageSrc = '';

            const imageLinks = document.querySelectorAll('.image-link');

            imageLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const src = this.getAttribute('data-src');
                    const alt = this.getAttribute('data-alt');
                    const desc = this.getAttribute('data-desc');
                    const imageName = src.split('/').pop();

                    currentImageSrc = src;
                    modalImage.src = src;
                    modalImage.alt = alt;
                    modalTitle.textContent = imageName;
                    modalDescription.textContent = desc;
                    aiDescriptionContainer.style.display = 'none';
                    aiDescriptionText.textContent = '';
                    aiDescriptionBtn.disabled = false;
                    modal.style.display = 'flex';
                });
            });

            closeBtn.addEventListener('click', function() {
                modal.style.display = 'none';
            });

            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    modal.style.display = 'none';
                }
            });

            aiDescriptionBtn.addEventListener('click', async function() {
                if (!HUGGINGFACE_API_KEY) {
                    aiDescriptionText.textContent = 'Please add your Hugging Face API key in the code.';
                    aiDescriptionContainer.style.display = 'block';
                    return;
                }

                aiDescriptionBtn.disabled = true;
                loadingSpinner.style.display = 'inline-block';
                aiDescriptionContainer.style.display = 'block';
                aiDescriptionText.textContent = '';

                try {
                    const response = await fetch(HUGGINGFACE_API_URL, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${HUGGINGFACE_API_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            inputs: currentImageSrc
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`API Error: ${response.status} - ${response.statusText}`);
                    }

                    const data = await response.json();
                    
                    if (data && data[0] && data[0].generated_text) {
                        aiDescriptionText.textContent = data[0].generated_text;
                    } else {
                        aiDescriptionText.textContent = 'Could not generate description. Try again.';
                    }
                } catch (error) {
                    console.error('Error generating AI description:', error);
                    aiDescriptionText.textContent = 'Error generating description. Check console.';
                } finally {
                    loadingSpinner.style.display = 'none';
                    aiDescriptionBtn.disabled = false;
                }
            });
        });
    </script>
