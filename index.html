    <script>
        // Transparency now cached in checkAndCacheTransparency        const transparencyCache = new Map();

        function checkAndCacheTransparency(src) {
            if (transparencyCache.has(src)) {
                return Promise.resolve(transparencyCache.get(src));
            }
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth || 1;
                    canvas.height = img.naturalHeight || 1;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    let hasAlpha = false;
                    for (let i = 3; i < imageData.data.length; i += 4) {
                        if (imageData.data[i] < 255) {
                            hasAlpha = true;
                            break;
                        }
                    }
                    transparencyCache.set(src, hasAlpha);
                    resolve(hasAlpha);
                };
                img.onerror = () => resolve(false);
                img.src = src;
            });
        }

            const canvas = document.createElement('canvas');
            canvas.width = image.naturalWidth || 300;
            canvas.height = image.naturalHeight || 300;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(image, 0, 0);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            for (let i = 3; i < imageData.data.length; i += 4) {
                if (imageData.data[i] < 255) {
                    return true;
                }
            }
            return false;
        }
                async function processImage(imageSrc, needsDataUri = false) {
            const cached = transparencyCache.get(imageSrc);
            if (cached !== undefined) {
                if (needsDataUri) {
                    return { hasAlpha: cached, dataUri: imageToDataUri(imageSrc) };
                }
                return cached;
            }
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = async () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth || 1;
                    canvas.height = img.naturalHeight || 1;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    let hasAlpha = false;
                    for (let i = 3; i < imageData.data.length; i += 4) {
                        if (imageData.data[i] < 255) {
                            hasAlpha = true;
                            break;
                        }
                    }
                    transparencyCache.set(imageSrc, hasAlpha);
                    if (needsDataUri) {
                        const dataUri = await imageToDataUri(imageSrc);
                        resolve({ hasAlpha, dataUri });
                    } else {
                        resolve(hasAlpha);
                    }
                };
                img.onerror = () => resolve(needsDataUri ? { hasAlpha: false, dataUri: '' } : false);
                img.src = imageSrc;
            });
        }

function imageToDataUri(imageSrc) {
            return new Promise((resolve, reject) => {
                if (imageSrc.startsWith('data:')) {
                    resolve(imageSrc);
                    return;
                }
                const image = new Image();
                image.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = image.naturalWidth || 300;
                    canvas.height = image.naturalHeight || 300;
                    const ctx = canvas.getContext('2d');
                    const hasAlpha = await checkAndCacheTransparency(imageSrc);
                    if (hasAlpha) {
                        ctx.fillStyle = 'white';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }
                    ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg'));
                };
                image.onerror = () => reject(new Error('Unable to prepare the selected image.'));
                image.src = imageSrc;
            });
        }
        async function generateAIDescription(imageSrc, imageId, options = {}) {
            const requestImage = await imageToDataUri(imageSrc);
            const params = {
                seed: options.seed !== undefined ? options.seed : Math.floor(Math.random() * 2147483647),
                temperature: options.temperature !== undefined ? options.temperature : 0.7,
                repetition_penalty: options.repetition_penalty !== undefined ? options.repetition_penalty : 1.1,
                top_p: 0.9,
                top_k: 50
            };
            const response = await fetch('/api/generate-description', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    imageId, 
                    image: requestImage,
                    seed: params.seed,
                    temperature: params.temperature,
                    repetition_penalty: params.repetition_penalty,
                    top_p: params.top_p,
                    top_k: params.top_k
                })
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || 'Cerebras could not generate a description.');
            }
            return data;
        }
        function setCardDescription(link, description) {
            link.dataset.desc = description;
            const cardDescription = link.closest('.card')?.querySelector('.card-content p');
            if (cardDescription) {
                cardDescription.textContent = description;
            }
        }
        function getBgColor(hexValue) {
            const hex = hexValue.toString(16).padStart(2, '0');
            return '#' + hex + hex + hex;
        }
        function updateBgColor() {
            bgColorValue = parseInt(bgSlider.value);
            const color = getBgColor(bgColorValue);
            bgColorPreview.style.backgroundColor = color;
            saveBgColor(currentImageId, bgColorValue);
        }
        function saveBgColor(imageId, value) {
            localStorage.setItem('bgColor_' + imageId, value.toString());
        }
        function loadBgColor(imageId) {
            const saved = localStorage.getItem('bgColor_' + imageId);
            if (saved !== null) {
                return parseInt(saved);
            }
            return 255; // default to white
        }
        function applyBgColorToImage(imgElement, hexValue) {
            const color = getBgColor(hexValue);
            const container = document.createElement('div');
            container.style.backgroundColor = color;
            container.style.display = 'inline-block';
            container.style.padding = '0';
            container.style.margin = '0';
            container.appendChild(imgElement.cloneNode(true));
            return container;
        }
        async function checkAndCacheTransparency(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth || 1;
                    canvas.height = img.naturalHeight || 1;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    for (let i = 3; i < imageData.data.length; i += 4) {
                        if (imageData.data[i] < 255) {
                            resolve(true);
                            return;
                        }
                    }
                    resolve(false);
                };
                img.onerror = () => resolve(false);
                img.src = src;
            });
        }
        function applyBgToGalleryImage(imgElement, hexValue) {
            const color = getBgColor(hexValue);
            const wrapper = imgElement.closest('.card-image-wrapper');
            if (wrapper) {
                wrapper.style.backgroundColor = color;
            }
        }
        function setupGalleryImageWithBg(card, imageId, src) {
            const img = card.querySelector('img');
            if (!img) return;
            const hasAlpha = await checkAndCacheTransparency(src);
            if (hasAlpha) {
                const wrapper = document.createElement('div');
                wrapper.className = 'card-image-wrapper';
                const bgValue = loadBgColor(imageId);
                wrapper.style.backgroundColor = getBgColor(bgValue);
                img.parentNode.insertBefore(wrapper, img);
                wrapper.appendChild(img);
            }
        }
        document.addEventListener('DOMContentLoaded', async function() {
            await loadImageMetadata();
            const modal = document.getElementById('fullscreenModal');
            const modalImage = document.getElementById('modalImage');
            const modalTitle = document.getElementById('modalTitle');
            const modalDescription = document.getElementById('modalDescription');
            const closeBtn = document.querySelector('.close');
            const aiDescriptionBtn = document.getElementById('aiDescriptionBtn');
            const aiDescriptionContainer = document.getElementById('aiDescriptionContainer');
            const aiDescriptionText = document.getElementById('aiDescriptionText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const regenControls = document.getElementById('regenControls');
            const regenBtn = document.getElementById('regenBtn');
            const creativityToggle = document.getElementById('creativityToggle');
            const bgSliderContainer = document.getElementById('bgSliderContainer');
            const bgSlider = document.getElementById('bgSlider');
            const bgColorPreview = document.getElementById('bgColorPreview');
            let currentImageSrc = '';
            let currentImageId = '';
            let currentImageLink = null;
            let descriptionsByImage = {};

        let imageMetadata = {};

        async function loadImageMetadata() {
            try {
                const response = await fetch('image-metadata.json');
                if (response.ok) {
                    imageMetadata = await response.json();
                }
            } catch (error) {
                console.warn('Could not load image metadata:', error);
            }
        }

        function hasAlpha(src) {
            return imageMetadata[src]?.hasAlpha || false;
        }

            let useHighCreativity = false;
        const DOM = {
            fullscreenModal: DOM.fullscreenModal,
            modalImage: DOM.modalImage,
            modalTitle: DOM.modalTitle,
            modalDescription: DOM.modalDescription,
            closeBtn: DOM.closeBtn,
            aiDescriptionBtn: DOM.aiDescriptionBtn,
            aiDescriptionContainer: DOM.aiDescriptionContainer,
            aiDescriptionText: DOM.aiDescriptionText,
            loadingSpinner: DOM.loadingSpinner,
            regenControls: DOM.regenControls,
            regenBtn: DOM.regenBtn,
            creativityToggle: DOM.creativityToggle,
            bgSliderContainer: DOM.bgSliderContainer,
            bgSlider: DOM.bgSlider,
            bgColorPreview: DOM.bgColorPreview,
            shuffleBtn: DOM.shuffleBtn,
            gallery: DOM.gallery,
            imageLinks: DOM.imageLinks,
            cards: DOM.cards,
            close: DOM.close,
            galleryEl: DOM.galleryEl
        };
            let bgColorValue = 255;
            try {
                const response = await fetch('/api/descriptions');
                if (response.ok) {
                    descriptionsByImage = await response.json();
                }
            } catch (error) {
                console.warn('Saved descriptions could not be loaded:', error);
            }
            const imageLinks = document.querySelectorAll('.image-link');
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                const link = card.querySelector('.image-link');
                if (link) {
                    const imageId = link.dataset.imageId;
                    const src = link.getAttribute('data-src') || link.querySelector('img')?.src || '';
                    if (imageId && src) {
                        setupGalleryImageWithBg(card, imageId, src);
                    }
                }
            });
            imageLinks.forEach(link => {
                const savedDescription = descriptionsByImage[link.dataset.imageId]?.description;
                if (savedDescription) {
                    setCardDescription(link, savedDescription);
                }
            });
            imageLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const src = this.getAttribute('data-src') || this.querySelector('img')?.src || '';
                    const alt = this.getAttribute('data-alt');
                    const desc = this.getAttribute('data-desc');
                    const imageName = src.startsWith('data:') ? alt : src.split('/').pop();
                    const imageId = this.dataset.imageId;
                    const savedDescription = descriptionsByImage[imageId]?.description;
                    currentImageSrc = src;
                    currentImageId = imageId;
                    currentImageLink = this;
                    bgColorValue = loadBgColor(imageId);
                    modalImage.src = src;
                    modalImage.alt = alt;
                    modalTitle.textContent = imageName;
                    if (savedDescription) {
                        modalDescription.textContent = savedDescription;
                        aiDescriptionText.textContent = savedDescription;
                        aiDescriptionContainer.style.display = 'block';
                        aiDescriptionBtn.style.display = 'none';
                        regenControls.style.display = 'flex';
                    } else {
                        modalDescription.textContent = desc;
                        aiDescriptionContainer.style.display = 'none';
                        aiDescriptionText.textContent = '';
                        aiDescriptionBtn.style.display = 'inline-block';
                        aiDescriptionBtn.disabled = false;
                        regenControls.style.display = 'none';
                    }
                    modal.style.display = 'flex';
                    bgSlider.value = bgColorValue;
                    bgColorPreview.style.backgroundColor = getBgColor(bgColorValue);
                    bgSliderContainer.style.display = 'block';
                });
            });
            closeBtn.addEventListener('click', function() {
                modal.style.display = 'none';
                bgSliderContainer.style.display = 'none';
            });
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.style.display = 'none';
                    bgSliderContainer.style.display = 'none';
                }
            });
            const shuffleBtn = document.getElementById('shuffleBtn');
            const gallery = document.querySelector('.gallery');
            shuffleBtn.addEventListener('click', function() {
                const cards = Array.from(gallery.querySelectorAll('.card'));
                for (let i = cards.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [cards[i], cards[j]] = [cards[j], cards[i]];
                }
                cards.forEach(card => gallery.appendChild(card));
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    modal.style.display = 'none';
                }
            });
            bgSlider.addEventListener('input', updateBgColor);
            creativityToggle.addEventListener('click', function() {
                useHighCreativity = !useHighCreativity;
                creativityToggle.textContent = useHighCreativity ? 'Less Creative' : 'More Creative';
                creativityToggle.classList.toggle('active', useHighCreativity);
            });
            regenBtn.addEventListener('click', async function() {
                regenBtn.disabled = true;
                loadingSpinner.style.display = 'inline-block';
                aiDescriptionText.textContent = 'Regenerating description...';
                try {
                    const temperature = useHighCreativity ? 0.9 : 0.3;
                    const result = await generateAIDescription(currentImageSrc, currentImageId, {
                        seed: Math.floor(Math.random() * 2147483647),
                        temperature: temperature,
                        repetition_penalty: 1.15
                    });
                    const description = result.description;
                    descriptionsByImage[currentImageId] = {
                        description,
                        image_hash: result.image_hash || ''
                    };
                    setCardDescription(currentImageLink, description);
                    aiDescriptionText.textContent = description;
                    modalDescription.textContent = description;
                } catch (error) {
                    console.error('Error regenerating AI description:', error);
                    aiDescriptionText.textContent = error.message || 'Error regenerating description. Try again.';
                } finally {
                    loadingSpinner.style.display = 'none';
                    regenBtn.disabled = false;
                }
            });
            aiDescriptionBtn.addEventListener('click', async function() {
                aiDescriptionBtn.disabled = true;
                loadingSpinner.style.display = 'inline-block';
                aiDescriptionContainer.style.display = 'block';
                aiDescriptionText.textContent = 'Generating a description with Cerebras…';
                try {
                    const result = await generateAIDescription(currentImageSrc, currentImageId);
                    const description = result.description;
                    descriptionsByImage[currentImageId] = {
                        description,
                        image_hash: result.image_hash || ''
                    };
                    setCardDescription(currentImageLink, description);
                    aiDescriptionText.textContent = description;
                    modalDescription.textContent = description;
                    aiDescriptionBtn.style.display = 'none';
                    regenControls.style.display = 'flex';
                } catch (error) {
                    console.error('Error generating AI description:', error);
                    aiDescriptionText.textContent = error.message || 'Error generating description. Try again.';
                } finally {
                    loadingSpinner.style.display = 'none';
                    if (aiDescriptionBtn.style.display !== 'none') {
                        aiDescriptionBtn.disabled = false;
                    }
                }
            });
        });
    </script>
</body>
</html>
